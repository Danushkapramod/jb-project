<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Owner Registration | Agri Connect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="/config.js"></script>
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">

  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <a href="/" class="inline-flex items-center space-x-2 text-emerald-800 font-bold text-2xl mb-2">
      <span class="text-3xl">🚜</span>
      <span>Agri Connect</span>
    </a>
    <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Agricultural Vehicle Owner Registration</h2>
    <p class="mt-2 text-sm text-slate-600">Register your vehicle to receive on-demand dispatch alerts</p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-lg">
    <div class="bg-white py-8 px-6 shadow-xl rounded-2xl sm:px-10 border border-slate-100">

      <!-- Alert Banner -->
      <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm font-medium"></div>

      <form id="registerForm" class="space-y-4">
        <!-- Full Name -->
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Full Name</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
              <i class="fa-solid fa-user"></i>
            </span>
            <input type="text" id="name" required placeholder="e.g. Sunil Perera"
              class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm">
          </div>
        </div>

        <!-- Email -->
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
              <i class="fa-solid fa-envelope"></i>
            </span>
            <input type="email" id="email" required placeholder="sunil@example.com"
              class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm">
          </div>
          <p id="emailError" class="hidden text-xs text-red-600 mt-1">Please enter a valid email address.</p>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" id="password" required minlength="6" placeholder="At least 6 characters"
              class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm">
          </div>
        </div>

        <!-- Phone / WhatsApp Number -->
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Contact / WhatsApp Number</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
              <i class="fa-brands fa-whatsapp text-emerald-600"></i>
            </span>
            <input type="text" id="phone" required placeholder="e.g. 0771234567 or 94771234567"
              class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm">
          </div>
          <p class="text-xs text-slate-400 mt-1">This number will be sent to the requester upon booking approval.</p>
        </div>

        <!-- Vehicle Type (Single Select - 5 Options) -->
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Vehicle Type (Select One)</label>
          <div class="relative">
            <select id="vehicleType" required
              class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm bg-white font-medium text-slate-800">
              <option value="" disabled selected>-- Select Vehicle Category --</option>
              <option value="Tractor">🚜 Tractor (4WD / 2WD Farm Tractor)</option>
              <option value="Harvester">🌾 Harvester (Crop & Grain Harvester)</option>
              <option value="PowerTiller">🚜⚡ PowerTiller (2-Wheel Walking Tractor)</option>
              <option value="WaterPump">💧 WaterPump (High-Flow Irrigation Pump)</option>
              <option value="Rotavator">⚙️ Rotavator (Soil Tillage & Cultivator)</option>
            </select>
          </div>
        </div>

        <!-- Vehicle Registration Number -->
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Vehicle Registration No</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
              <i class="fa-solid fa-id-card"></i>
            </span>
            <input type="text" id="vehicleRegNo" required placeholder="e.g. WP-CAT-8492"
              class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm">
          </div>
        </div>

        <!-- Location / Base -->
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Base Location / Area</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
              <i class="fa-solid fa-location-dot"></i>
            </span>
            <input type="text" id="location" required placeholder="e.g. North Farm Shed / Zone 3"
              class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm">
          </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-3">
          <button type="submit" id="submitBtn"
            class="w-full bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-lg transition duration-150 flex items-center justify-center space-x-2">
            <span>Register & Start Receiving Jobs</span>
            <i class="fa-solid fa-arrow-right text-sm"></i>
          </button>
        </div>
      </form>

      <div class="mt-6 text-center text-sm text-slate-500">
        Already registered?
        <a href="/login.html" class="font-semibold text-emerald-700 hover:text-emerald-600">Log in here</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertBox');
    const emailInput = document.getElementById('email');
    const emailError = document.getElementById('emailError');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(msg, isSuccess = false) {
      alertBox.className = isSuccess 
        ? 'mb-6 p-4 rounded-xl text-sm font-medium bg-green-50 text-green-800 border border-green-200' 
        : 'mb-6 p-4 rounded-xl text-sm font-medium bg-red-50 text-red-800 border border-red-200';
      alertBox.textContent = msg;
      alertBox.classList.remove('hidden');
    }

    emailInput.addEventListener('input', () => {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (emailInput.value.length > 0 && !emailRegex.test(emailInput.value.trim())) {
        emailError.classList.remove('hidden');
      } else {
        emailError.classList.add('hidden');
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const phone = document.getElementById('phone').value.trim();
      const vehicleType = document.getElementById('vehicleType').value;
      const vehicleRegNo = document.getElementById('vehicleRegNo').value.trim();
      const location = document.getElementById('location').value.trim();

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showAlert('Please provide a valid email address.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>Registering...</span>`;

      try {
        const response = await fetch(`${window.CONFIG.API_URL}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, phone, vehicleRegNo, vehicleType, location })
        });

        const data = await response.json();

        if (!response.ok) {
          showAlert(data.error || 'Registration failed. Please try again.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<span>Register & Start Receiving Jobs</span><i class="fa-solid fa-arrow-right text-sm"></i>`;
          return;
        }

        showAlert('Registration successful! Redirecting to driver dashboard...', true);
        localStorage.setItem('agri_token', data.token);
        localStorage.setItem('agri_user', JSON.stringify(data.user));

        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 1200);

      } catch (err) {
        showAlert('Network error. Could not connect to server.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Register & Start Receiving Jobs</span><i class="fa-solid fa-arrow-right text-sm"></i>`;
      }
    });
  </script>
</body>
</html>
